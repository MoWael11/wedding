spring.application.name=backend

# DB Config
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:wedding_db}
spring.datasource.username=${MYSQL_USER:wedding_user}
spring.datasource.password=${MYSQL_PASSWORD:wedding_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# App Config
app.upload.path=src/main/resources/static/images
app.base.url=${APP_BASE_URL:http://localhost:8080}
